name: Refresh dashboard data and Spark evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/build_spark_summary.py"
      - "backend/**"
      - "data/sample/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "dashboard-data.js"
      - "live-weather.js"
      - "README.md"
      - "docs/**"
      - ".github/workflows/refresh-live-data.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the gh-pages push is a fast-forward, not a "fetch first" rejection.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # PySpark 3.5.x relies on javax.security.auth.Subject.getSubject, which is
      # unsupported from JDK 24 on. Pin Java 17 so the Spark job starts reliably.
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install PySpark
        run: python -m pip install pyspark==3.5.3

      - name: Run Spark RDD risk batch
        run: python -m backend.spark.jobs.calculate_risk_batch --engine spark --input data/sample --output data/processed --batch-id actions-${{ github.run_id }}

      - name: Build PySpark RDD evidence
        run: python scripts/build_spark_summary.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spark-evidence.js risk-latest.js risk-history.js risk-feature.js data/processed
          if git diff --cached --quiet; then
            echo "No generated data changes"
          else
            git commit -m "Refresh dashboard data and Spark evidence"
            git push origin HEAD:main
          fi
          git push origin HEAD:gh-pages
